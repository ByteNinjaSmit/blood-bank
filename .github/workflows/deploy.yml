name: Advanced CI/CD - BloodBank Backend

on:
  push:
    branches: ["main"]

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    name: Build, Test & Push Docker Image

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build image with version tag + latest
      - name: Build Docker Image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/blood-bank-api
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} ./server

      # Security Scan
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/blood-bank-api:latest
          format: table
          exit-code: 0

      # Push Image
      - name: Push Docker Image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/blood-bank-api
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}


  deploy:
    needs: build-test-push
    runs-on: ubuntu-latest
    name: Deploy to Production Server

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/blood-bank-api
            cd ~/blood-bank

            echo "------ Pulling Latest Docker Image ------"
            sudo docker pull $IMAGE:latest

            echo "------ Running Temporary Health Test Container ------"
            sudo docker rm -f api_test || true
            sudo docker run -d --name api_test -p 6000:5000 $IMAGE:latest
            sleep 10

            echo "------ Checking Health ------"
            if curl -fs http://localhost:6000/health; then
                echo "Health Check PASSED"
                sudo docker rm -f api_test
            else
                echo "❌ Health Check FAILED — ROLLING BACK"
                sudo docker rm -f api_test
                exit 1
            fi

            echo "------ Deploying to Production ------"
            sudo docker compose down
            sudo docker compose up -d --scale api=2

            echo "------ Cleaning Unused Docker Images ------"
            sudo docker image prune -f

      - name: Deployment Success
        if: success()
        run: echo "🎉 Deployment Successful!"

      - name: Deployment Failed
        if: failure()
        run: echo "❌ Deployment Failed. Previous version kept running."
