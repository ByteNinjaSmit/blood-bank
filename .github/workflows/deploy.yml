name: Advanced CI/CD - BloodBank Backend

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  # ---------------------------------------------------------------------
  # Quality gate. Runs on every push + PR. Must pass before any image is
  # built or pushed. Lint + typecheck + unit tests for the server's new
  # SOLID tree, plus client lint + build.
  # ---------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Server lint
        working-directory: server
        run: npm run lint

      - name: Server typecheck
        working-directory: server
        run: npm run typecheck

      - name: Server build (tsc + tsc-alias)
        working-directory: server
        run: npm run build

      - name: Server tests (vitest)
        working-directory: server
        run: npm test

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Client lint
        working-directory: client
        run: npm run lint

      - name: Client build (vite)
        working-directory: client
        run: npm run build

  build-test-push:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/blood-bank-api
          docker build --no-cache -t $IMAGE:latest -t $IMAGE:${{ github.sha }} ./server

      - name: Security Scan (Trivy) - block on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/blood-bank-api:latest
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Push Docker Image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/blood-bank-api
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}


  deploy:
    needs: build-test-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.1.0
        env:
          # All secrets come from GitHub Repository Secrets. Nothing
          # sensitive is allowed in this file. Update via the GitHub UI:
          #   Settings → Secrets and variables → Actions.
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/blood-bank-api
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          ACCESS_TOKEN_EXPIRY: ${{ secrets.ACCESS_TOKEN_EXPIRY }}
          REFRESH_TOKEN_EXPIRY: ${{ secrets.REFRESH_TOKEN_EXPIRY }}
          CORS_SERVER: ${{ secrets.CORS_SERVER }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_SECURE: ${{ secrets.EMAIL_SECURE }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          NEAR_EXPIRY_DAYS: ${{ secrets.NEAR_EXPIRY_DAYS }}
          REPORTS_DIR: ${{ secrets.REPORTS_DIR }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SNS_PHONE: ${{ secrets.SNS_PHONE }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          SYSTEM_USER_ID: ${{ secrets.SYSTEM_USER_ID }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          envs: IMAGE_NAME,MONGODB_URI,JWT_SECRET,JWT_SECRET_KEY,ACCESS_TOKEN_EXPIRY,REFRESH_TOKEN_EXPIRY,CORS_SERVER,EMAIL_USER,EMAIL_PASS,EMAIL_HOST,EMAIL_PORT,EMAIL_SECURE,ADMIN_EMAIL,NEAR_EXPIRY_DAYS,REPORTS_DIR,TIMEZONE,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,SNS_PHONE,TWILIO_ACCOUNT_SID,TWILIO_AUTH_TOKEN,TWILIO_PHONE_NUMBER,SYSTEM_USER_ID,LOG_LEVEL

          script: |
            set -euo pipefail
            APP_DIR=/root/blood-bank
            cd $APP_DIR

            echo "------ Refreshing host .env from CI-provided secrets ------"
            umask 077
            cat > .env <<EOF
            NODE_ENV=production
            PORT=5000
            LOG_LEVEL=${LOG_LEVEL:-info}
            TIMEZONE=${TIMEZONE}
            MONGODB_URI=${MONGODB_URI}
            REDIS_URL=redis://redis:6379
            CORS_SERVER=${CORS_SERVER}
            JWT_SECRET=${JWT_SECRET}
            JWT_SECRET_KEY=${JWT_SECRET_KEY}
            ACCESS_TOKEN_EXPIRY=${ACCESS_TOKEN_EXPIRY}
            REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY}
            EMAIL_USER=${EMAIL_USER}
            EMAIL_PASS=${EMAIL_PASS}
            EMAIL_HOST=${EMAIL_HOST}
            EMAIL_PORT=${EMAIL_PORT}
            EMAIL_SECURE=${EMAIL_SECURE}
            ADMIN_EMAIL=${ADMIN_EMAIL}
            NEAR_EXPIRY_DAYS=${NEAR_EXPIRY_DAYS}
            REPORTS_DIR=${REPORTS_DIR}
            AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
            AWS_REGION=${AWS_REGION}
            SNS_PHONE=${SNS_PHONE}
            TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
            TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
            TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
            SYSTEM_USER_ID=${SYSTEM_USER_ID}
            EOF
            chmod 600 .env

            echo "------ Pulling latest code from GitHub ------"
            git pull origin main

            echo "------ Pulling latest docker image ------"
            sudo docker pull "$IMAGE_NAME":latest

            echo "------ Pre-flight: start a throwaway api+redis on isolated network ------"
            sudo docker network create bb_preflight || true
            sudo docker rm -f bb_redis_test bb_api_test || true
            sudo docker run -d --name bb_redis_test --network bb_preflight redis:7-alpine
            sudo docker run -d --name bb_api_test --network bb_preflight \
              --env-file .env \
              -e REDIS_URL=redis://bb_redis_test:6379 \
              -p 5050:5000 \
              "$IMAGE_NAME":latest

            HEALTH_OK=false
            for i in {1..10}; do
              if curl -fs http://localhost:5050/health; then
                echo "Health check PASSED"
                HEALTH_OK=true
                break
              fi
              echo "Health check failed... retrying ($i/10)"
              sleep 5
            done

            echo "------ Tearing down preflight ------"
            sudo docker rm -f bb_api_test bb_redis_test || true
            sudo docker network rm bb_preflight || true

            if [ "$HEALTH_OK" != true ]; then
              echo "Deployment cancelled - health check failed"
              exit 1
            fi

            echo "------ Deploying new version ------"
            sudo docker compose down
            sudo docker compose pull
            sudo docker compose up -d --scale api=2

            echo "------ Cleaning unused docker images ------"
            sudo docker image prune -f

      - name: Deployment Success
        if: success()
        run: echo "Deployment Successful"

      - name: Deployment Failed
        if: failure()
        run: echo "Deployment Failed"
