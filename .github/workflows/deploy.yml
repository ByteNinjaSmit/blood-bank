name: Advanced CI/CD - BloodBank Backend

on:
  push:
    branches: ["main"]

jobs:

  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/blood-bank-api
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} ./server

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/blood-bank-api:latest
          format: table
          exit-code: 0

      - name: Push Docker Image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/blood-bank-api
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}


  deploy:
    needs: build-test-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true

          script: |
            IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/blood-bank-api
            APP_DIR=/home/smitrajbankar11/blood-bank

            cd $APP_DIR

            echo "------ Pulling latest code ------"
            git pull origin main

            echo "------ Pulling latest docker image ------"
            sudo docker pull $IMAGE:latest

            echo "------ Starting temporary test container ------"
            sudo docker rm -f api_test || true
            sudo docker run -d --name api_test -p 6000:5000 $IMAGE:latest

            echo "Waiting 20 seconds for API to boot..."
            sleep 20

            echo "------ Running health check ------"
            for i in {1..5}; do
              if curl -fs http://localhost:6000/health; then
                echo "Health check PASSED ✅"
                HEALTH_OK=true
                break
              fi
              echo "Health check failed... retrying ($i/5)"
              sleep 5
            done

            sudo docker rm -f api_test

            if [ "$HEALTH_OK" != true ]; then
              echo "❌ Deployment stopped — health check failed"
              exit 1
            fi

            echo "------ Deploying new version ------"
            sudo docker compose down
            sudo docker compose up -d --scale api=2

            echo "------ Cleaning unused images ------"
            sudo docker image prune -f

      - name: Deployment Success
        if: success()
        run: echo "🎉 Deployment Successful!"

      - name: Deployment Failed
        if: failure()
        run: echo "❌ Deployment Failed"
