name: Advanced CI/CD - BloodBank Backend

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  # ---------------------------------------------------------------------
  # Quality gate. Runs on every push + PR. Must pass before any image is
  # built or pushed.
  #
  # Server only. This pipeline builds and deploys the API image; the
  # client is built and hosted by Vercel from its own project, so its
  # lint/build gate lives there and is not duplicated here.
  # ---------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Server lint
        working-directory: server
        run: npm run lint

      - name: Server typecheck
        working-directory: server
        run: npm run typecheck

      - name: Server build (tsc + tsc-alias)
        working-directory: server
        run: npm run build

      - name: Server tests (vitest)
        working-directory: server
        run: npm test

  build-test-push:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/blood-bank-api
          docker build --no-cache -t $IMAGE:latest -t $IMAGE:${{ github.sha }} ./server

      - name: Security Scan (Trivy) - block on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/blood-bank-api:latest
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Push Docker Image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/blood-bank-api
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}


  deploy:
    needs: build-test-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.1.0
        env:
          # All secrets come from GitHub Repository Secrets. Nothing
          # sensitive is allowed in this file. Update via the GitHub UI:
          #   Settings → Secrets and variables → Actions.
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/blood-bank-api
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          ACCESS_TOKEN_EXPIRY: ${{ secrets.ACCESS_TOKEN_EXPIRY }}
          REFRESH_TOKEN_EXPIRY: ${{ secrets.REFRESH_TOKEN_EXPIRY }}
          CORS_SERVER: ${{ secrets.CORS_SERVER }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_SECURE: ${{ secrets.EMAIL_SECURE }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          BANK_NAME: ${{ secrets.BANK_NAME }}
          BANK_ADDRESS: ${{ secrets.BANK_ADDRESS }}
          BANK_PHONE: ${{ secrets.BANK_PHONE }}
          BANK_LICENSE: ${{ secrets.BANK_LICENSE }}
          BANK_WEBSITE: ${{ secrets.BANK_WEBSITE }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PUBLIC_URL: ${{ secrets.S3_PUBLIC_URL }}
          NEAR_EXPIRY_DAYS: ${{ secrets.NEAR_EXPIRY_DAYS }}
          REPORTS_DIR: ${{ secrets.REPORTS_DIR }}
          SYSTEM_USER_ID: ${{ secrets.SYSTEM_USER_ID }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          envs: IMAGE_NAME,MONGODB_URI,JWT_SECRET,JWT_SECRET_KEY,ACCESS_TOKEN_EXPIRY,REFRESH_TOKEN_EXPIRY,CORS_SERVER,EMAIL_USER,EMAIL_PASS,EMAIL_FROM_NAME,EMAIL_HOST,EMAIL_PORT,EMAIL_SECURE,ADMIN_EMAIL,BANK_NAME,BANK_ADDRESS,BANK_PHONE,BANK_LICENSE,BANK_WEBSITE,S3_ENDPOINT,S3_REGION,S3_ACCESS_KEY,S3_SECRET_KEY,S3_BUCKET,S3_PUBLIC_URL,NEAR_EXPIRY_DAYS,REPORTS_DIR,SYSTEM_USER_ID,LOG_LEVEL

          script: |
            set -euo pipefail
            APP_DIR=/root/blood-bank
            cd $APP_DIR

            echo "------ Refreshing host .env from CI-provided secrets ------"
            umask 077
            cat > .env <<EOF
            NODE_ENV=production
            PORT=5000
            LOG_LEVEL=${LOG_LEVEL:-info}
            MONGODB_URI=${MONGODB_URI}
            REDIS_URL=redis://redis:6379
            CORS_SERVER=${CORS_SERVER}
            JWT_SECRET=${JWT_SECRET}
            JWT_SECRET_KEY=${JWT_SECRET_KEY}
            ACCESS_TOKEN_EXPIRY=${ACCESS_TOKEN_EXPIRY:-15m}
            REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY:-7d}
            EMAIL_USER=${EMAIL_USER}
            EMAIL_PASS=${EMAIL_PASS}
            EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Sanjivani Blood Bank}
            EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
            EMAIL_PORT=${EMAIL_PORT:-465}
            EMAIL_SECURE=${EMAIL_SECURE:-true}
            ADMIN_EMAIL=${ADMIN_EMAIL}
            BANK_NAME=${BANK_NAME}
            BANK_ADDRESS=${BANK_ADDRESS}
            BANK_PHONE=${BANK_PHONE}
            BANK_LICENSE=${BANK_LICENSE}
            BANK_WEBSITE=${BANK_WEBSITE:-https://sanjivanibloodbank.org}
            S3_ENDPOINT=${S3_ENDPOINT}
            S3_REGION=${S3_REGION:-us-east-1}
            S3_ACCESS_KEY=${S3_ACCESS_KEY}
            S3_SECRET_KEY=${S3_SECRET_KEY}
            S3_BUCKET=${S3_BUCKET:-blood-bank}
            S3_PUBLIC_URL=${S3_PUBLIC_URL}
            NEAR_EXPIRY_DAYS=${NEAR_EXPIRY_DAYS:-2}
            REPORTS_DIR=${REPORTS_DIR:-./reports}
            SYSTEM_USER_ID=${SYSTEM_USER_ID}
            EOF
            chmod 600 .env

            echo "------ Pulling latest code from GitHub ------"
            git pull origin main

            echo "------ Pulling latest docker image ------"
            sudo docker pull "$IMAGE_NAME":latest

            echo "------ Pre-flight: start a throwaway api+redis on isolated network ------"
            sudo docker network create bb_preflight || true
            sudo docker rm -f bb_redis_test bb_api_test || true
            sudo docker run -d --name bb_redis_test --network bb_preflight redis:7-alpine
            sudo docker run -d --name bb_api_test --network bb_preflight \
              --env-file .env \
              -e REDIS_URL=redis://bb_redis_test:6379 \
              -p 5050:5000 \
              "$IMAGE_NAME":latest

            HEALTH_OK=false
            for i in {1..10}; do
              if curl -fs http://localhost:5050/health; then
                echo "Health check PASSED"
                HEALTH_OK=true
                break
              fi
              echo "Health check failed... retrying ($i/10)"
              sleep 5
            done

            echo "------ Tearing down preflight ------"
            sudo docker rm -f bb_api_test bb_redis_test || true
            sudo docker network rm bb_preflight || true

            if [ "$HEALTH_OK" != true ]; then
              echo "Deployment cancelled - health check failed"
              exit 1
            fi

            echo "------ Deploying new version ------"
            sudo docker compose down
            sudo docker compose pull
            sudo docker compose up -d --scale api=2

            echo "------ Cleaning unused docker images ------"
            sudo docker image prune -f

      - name: Deployment Success
        if: success()
        run: echo "Deployment Successful"

      - name: Deployment Failed
        if: failure()
        run: echo "Deployment Failed"
