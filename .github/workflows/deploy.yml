name: Advanced CI/CD - BloodBank Backend

on:
  push:
    branches: ["main"]

jobs:

  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/blood-bank-api
          docker build --no-cache -t $IMAGE:latest -t $IMAGE:${{ github.sha }} ./server

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/blood-bank-api:latest
          format: table
          exit-code: 0

      - name: Push Docker Image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/blood-bank-api
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}


  deploy:
    needs: build-test-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true

          script: |
            IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/blood-bank-api
            APP_DIR=/home/smitrajbankar11/blood-bank

            cd $APP_DIR

            echo "------ Pulling latest code from GitHub ------"
            git pull origin main

            echo "------ Pulling latest docker image ------"
            sudo docker pull $IMAGE:latest

            echo "------ Starting temporary test container ------"
            sudo docker rm -f api_test || true

            sudo docker run -d --name api_test \
              -p 6000:5000 \
              -e MONGODB_URI="mongodb+srv://admin:admin1234@cluster0.wvrn3hd.mongodb.net/" \
              -e PORT=5000 \
              -e JWT_SECRET="SMITRAJMERN2024" \
              -e CORS_SERVER="http://localhost:5173" \
              -e ACCESS_TOKEN_EXPIRY="15m" \
              -e REFRESH_TOKEN_EXPIRY="7d" \
              -e JWT_SECRET_KEY="BLOODBANK2025" \
              -e EMAIL_USER="smitrajbankar.test@gmail.com" \
              -e EMAIL_PASS="lehjvdcbvdfllcav" \
              -e NEAR_EXPIRY_DAYS="2" \
              -e REPORTS_DIR="./reports" \
              -e ADMIN_EMAIL="smitrajbankar.subscription@gmail.com" \
              -e EMAIL_HOST="smtp.gmail.com" \
              -e EMAIL_PORT="465" \
              -e EMAIL_SECURE="true" \
              -e TIMEZONE="Asia/Kolkata" \
              -e AWS_ACCESS_KEY_ID="AKIAVDY2B2AHD3Z4SWZQ" \
              -e AWS_SECRET_ACCESS_KEY="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" \
              -e AWS_REGION="ap-south-1" \
              -e SNS_PHONE="7057991669" \
              -e TWILIO_ACCOUNT_SID="AC4ee0a2e4d0ce07a8eb831190ed7d6772" \
              -e TWILIO_AUTH_TOKEN="38cf552d1bb78b2594e1becb32ded85e" \
              -e TWILIO_PHONE_NUMBER="+19104690618" \
              -e SYSTEM_USER_ID="68acce6acb0096e64764d7d6" \
              -e NODE_ENV=production \
              -e REDIS_URL="redis://localhost:6379" \
              $IMAGE:latest


            echo "Waiting for API to boot..."
            for i in {1..10}; do
              if curl -fs http://localhost:6000/health; then
                echo "Health check PASSED ✅"
                HEALTH_OK=true
                break
              fi
              echo "Health check failed... retrying ($i/10)"
              sleep 5
            done

            echo "Stopping test container..."
            sudo docker rm -f api_test

            if [ "$HEALTH_OK" != true ]; then
              echo "❌ Deployment cancelled — test container failed health check"
              exit 1
            fi

            echo "------ Deploying new version ------"
            sudo docker compose down
            sudo docker compose pull
            sudo docker compose up -d --scale api=2

            echo "------ Cleaning unused docker images ------"
            sudo docker image prune -f

      - name: Deployment Success
        if: success()
        run: echo "🎉 Deployment Successful!"

      - name: Deployment Failed
        if: failure()
        run: echo "❌ Deployment Failed"
