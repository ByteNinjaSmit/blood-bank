version: '3.8'

services:
  # Blood Bank API Server
  blood-bank-api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/blood-bank
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - JWT_EXPIRES_IN=7d
      - JWT_REFRESH_SECRET=your-super-secret-refresh-key-change-this-in-production
      - JWT_REFRESH_EXPIRES_IN=30d
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_SECURE=false
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - NEAR_EXPIRY_DAYS=5
      - REPORTS_DIR=./reports
      - MAX_FILE_SIZE=10485760
      - UPLOAD_PATH=./uploads
      - BCRYPT_ROUNDS=12
      - SESSION_SECRET=your-session-secret-change-this-in-production
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - SENSITIVE_RATE_LIMIT_WINDOW_MS=30000
      - SENSITIVE_RATE_LIMIT_MAX_REQUESTS=10
      - LOG_LEVEL=info
      - LOG_FILE_PATH=./logs
      - TIMEZONE=Asia/Kolkata
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - DB_POOL_SIZE=10
      - DB_POOL_TIMEOUT=30000
      - QUEUE_CONCURRENCY=1
      - QUEUE_MAX_ATTEMPTS=3
      - QUEUE_BACKOFF_DELAY=60000
      - PDF_FONT_PATH=./fonts
      - PDF_TEMP_DIR=./temp
      - HEALTH_CHECK_INTERVAL=30000
    depends_on:
      - mongo
      - redis
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB Database
  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=blood-bank
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - blood-bank-api
    restart: unless-stopped
    profiles:
      - proxy

volumes:
  mongo_data:
  redis_data:

networks:
  default:
    name: blood-bank-network
