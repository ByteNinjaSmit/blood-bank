        condition: service_healthy

    mem_limit: 2g
    mem_reservation: 1g
    cpus: "1.0"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - backend_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 192mb
      --maxmemory-policy allkeys-lru

    volumes:
      - redis-data:/data

    mem_limit: 512m
    cpus: "0.5"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - backend_net

  nginx:
    image: nginx:latest
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - backend_net

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis-data:

networks:
  backend_net:
    driver: bridge
