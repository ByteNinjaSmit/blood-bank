# -----------------------------------------------------------------------------
# Blood Bank — production stack (api ×N, redis, nginx).
#
# Secrets MUST NOT be committed. This file references variables only.
# On the prod host, supply them via:
#   - a `.env` file in this directory (read automatically by Compose), OR
#   - the calling shell's environment, OR
#   - `docker compose --env-file /path/to/secrets.env up -d`.
#
# A reference list of expected variables lives in `server/.env.example`.
# -----------------------------------------------------------------------------

services:
  api:
    image: byteninjasmit/blood-bank-api:latest
    pull_policy: always
    restart: unless-stopped

    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      PORT: "${PORT:-5000}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"

      MONGODB_URI: "${MONGODB_URI:?MONGODB_URI is required}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"

      CORS_SERVER: "${CORS_SERVER:?CORS_SERVER is required}"

      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}"
      ACCESS_TOKEN_EXPIRY: "${ACCESS_TOKEN_EXPIRY:-15m}"
      REFRESH_TOKEN_EXPIRY: "${REFRESH_TOKEN_EXPIRY:-7d}"

      EMAIL_USER: "${EMAIL_USER:?EMAIL_USER is required}"
      EMAIL_PASS: "${EMAIL_PASS:?EMAIL_PASS is required}"
      EMAIL_FROM_NAME: "${EMAIL_FROM_NAME:-Sanjivani Blood Bank}"
      EMAIL_HOST: "${EMAIL_HOST:-smtp.gmail.com}"
      EMAIL_PORT: "${EMAIL_PORT:-465}"
      EMAIL_SECURE: "${EMAIL_SECURE:-true}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:?ADMIN_EMAIL is required}"

      # Printed on PDF reports and email footers — wrong values here are a
      # compliance problem, so they are required rather than defaulted.
      BANK_NAME: "${BANK_NAME:?BANK_NAME is required}"
      BANK_ADDRESS: "${BANK_ADDRESS:?BANK_ADDRESS is required}"
      BANK_PHONE: "${BANK_PHONE:?BANK_PHONE is required}"
      BANK_LICENSE: "${BANK_LICENSE:?BANK_LICENSE is required}"
      BANK_WEBSITE: "${BANK_WEBSITE:-https://sanjivanibloodbank.org}"

      NEAR_EXPIRY_DAYS: "${NEAR_EXPIRY_DAYS:-2}"
      REPORTS_DIR: "${REPORTS_DIR:-./reports}"

      # S3-compatible object store (MinIO). modules/upload fails at runtime
      # without these.
      S3_ENDPOINT: "${S3_ENDPOINT:?S3_ENDPOINT is required}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:?S3_SECRET_KEY is required}"
      S3_BUCKET: "${S3_BUCKET:-blood-bank}"
      S3_PUBLIC_URL: "${S3_PUBLIC_URL:?S3_PUBLIC_URL is required}"

      SYSTEM_USER_ID: "${SYSTEM_USER_ID:?SYSTEM_USER_ID is required}"

    depends_on:
      redis:
        condition: service_healthy

    mem_limit: 2g
    mem_reservation: 1g
    cpus: "1.0"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - backend_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 192mb
      --maxmemory-policy allkeys-lru

    volumes:
      - redis-data:/data

    mem_limit: 512m
    cpus: "0.5"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - backend_net

  nginx:
    image: nginx:latest
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - backend_net

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis-data:

networks:
  backend_net:
    driver: bridge
