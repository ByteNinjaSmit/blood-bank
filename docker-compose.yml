version: "3.8"

# -----------------------------------------------------------------------------
# Blood Bank — production stack (api ×N, redis, nginx).
#
# Secrets MUST NOT be committed. This file references variables only.
# On the prod host, supply them via:
#   - a `.env` file in this directory (read automatically by Compose), OR
#   - the calling shell's environment, OR
#   - `docker compose --env-file /path/to/secrets.env up -d`.
#
# A reference list of expected variables lives in `server/.env.example`.
# -----------------------------------------------------------------------------

services:
  api:
    image: byteninjasmit/blood-bank-api:latest
    pull_policy: always
    restart: unless-stopped

    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      PORT: "${PORT:-5000}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      TIMEZONE: "${TIMEZONE:-Asia/Kolkata}"

      MONGODB_URI: "${MONGODB_URI:?MONGODB_URI is required}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"

      CORS_SERVER: "${CORS_SERVER:?CORS_SERVER is required}"

      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}"
      ACCESS_TOKEN_EXPIRY: "${ACCESS_TOKEN_EXPIRY:-15m}"
      REFRESH_TOKEN_EXPIRY: "${REFRESH_TOKEN_EXPIRY:-7d}"

      EMAIL_USER: "${EMAIL_USER:?EMAIL_USER is required}"
      EMAIL_PASS: "${EMAIL_PASS:?EMAIL_PASS is required}"
      EMAIL_HOST: "${EMAIL_HOST:-smtp.gmail.com}"
      EMAIL_PORT: "${EMAIL_PORT:-465}"
      EMAIL_SECURE: "${EMAIL_SECURE:-true}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:?ADMIN_EMAIL is required}"

      NEAR_EXPIRY_DAYS: "${NEAR_EXPIRY_DAYS:-2}"
      REPORTS_DIR: "${REPORTS_DIR:-./reports}"

      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_REGION: "${AWS_REGION:-ap-south-1}"
      SNS_PHONE: "${SNS_PHONE:-}"

      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_PHONE_NUMBER: "${TWILIO_PHONE_NUMBER:-}"

      SYSTEM_USER_ID: "${SYSTEM_USER_ID:?SYSTEM_USER_ID is required}"

    depends_on:
      redis:
        condition: service_healthy

    mem_limit: 2g
    mem_reservation: 1g
    cpus: "1.0"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - backend_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 192mb
      --maxmemory-policy allkeys-lru

    volumes:
      - redis-data:/data

    mem_limit: 512m
    cpus: "0.5"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - backend_net

  nginx:
    image: nginx:latest
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - backend_net

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis-data:

networks:
  backend_net:
    driver: bridge
